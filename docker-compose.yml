services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cro_reports}
      POSTGRES_USER: ${POSTGRES_USER:-cro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cro-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cro}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cro-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cro-minio-dev}
    volumes:
      - minio-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-cro}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-cro-dev}

  onlyoffice:
    image: onlyoffice/documentserver:latest
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-onlyoffice-dev-secret}
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data

  document-service:
    build: ./document-service
    environment:
      STORAGE_ROOT: /data
    volumes:
      - document-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cro_reports}
      DB_USER: ${POSTGRES_USER:-cro}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cro-dev}
      DOCUMENT_SERVICE_URL: http://document-service:8000
      ONLYOFFICE_PUBLIC_URL: http://localhost:8082
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-onlyoffice-dev-secret}
      JWT_SECRET: ${JWT_SECRET:-development-secret-must-be-replaced}
    depends_on:
      postgres:
        condition: service_healthy
      document-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres-data:
  minio-data:
  onlyoffice-data:
  document-data:

